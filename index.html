<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PocketPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F2;--card:#fff;--tx:#17231E;--mute:#78847D;--bd:#E5EBE5;--lime:#BAF36B;--deep:#183B2C;--soft:#EAF5DF;--neg:#DC6B60;--pos:#5B9E37;--r:18px}
:root[data-theme=dark]{--bg:#101916;--card:#19241F;--tx:#EDF5EE;--mute:#9AA99E;--bd:#2A3930;--soft:#263B2B;--pos:#9BD65A}
*{box-sizing:border-box;margin:0}
body{font:400 15px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background .25s,color .25s;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,.num{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.brand{font:800 26px 'Bricolage Grotesque';letter-spacing:-.05em}.brand b{color:var(--pos)}.brand span{color:var(--tx)}
main{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:var(--deep);color:#fff;border:0}.hero .mute{color:#b9cdbf}
.mute{color:var(--mute);font-size:13px}.num{font-weight:800;font-size:32px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--lime);color:#17231E;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.danger{color:var(--neg)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);margin:4px 0 10px}
label{font-size:13px;font-weight:600;color:var(--mute)}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pos);border-radius:8px;transition:width .6s}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;padding:8px 10px;min-width:60px;min-height:48px;border-radius:12px;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer}
nav button.on{background:var(--soft);color:var(--tx)}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--mute)}
.tabs button.active{background:var(--lime);color:#17231E}
#auth{max-width:400px;margin:0 auto;padding:12vh 16px}
dialog{border:1px solid var(--bd);border-radius:var(--r);background:var(--card);color:var(--tx);width:min(92vw,420px);padding:20px}
dialog::backdrop{background:#0008}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;display:none;max-width:90vw}
#toast.err{background:var(--neg)}
.hidden{display:none!important}
canvas{max-height:240px}
.chat{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="toast" role="status"></div>

<section id="auth" class="hidden">
  <div class="brand"><span>Pocket</span><b>Pulse</b></div>
  <p class="mute" style="margin:4px 0 20px">Your Money, In Motion.</p>
  <div class="tabs" role="tablist">
    <button type="button" id="tab-login" class="active" data-mode="login">Log in</button>
    <button type="button" id="tab-signup" data-mode="signup">Create account</button>
  </div>
  <form id="authForm" novalidate>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8" required>
    <div id="pw2wrap" class="hidden"><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <button class="btn" id="authBtn" style="width:100%">Log in</button>
  </form>
  <p style="margin-top:14px"><a href="#" id="forgot" class="mute">Forgot password?</a></p>
  <p id="cfgWarn" class="neg hidden" style="margin-top:14px">Supabase isn't configured yet. Add your project URL and anon key in index.html (see SETUP.md).</p>
</section>

<main id="app" class="hidden"><div id="view"></div></main>
<nav id="nav" class="hidden">
  <button data-v="home" class="on">Home</button><button data-v="targets">Targets</button><button data-v="wallets">Wallets</button><button data-v="reports">Reports</button><button data-v="ai">Gemini AI</button>
</nav>
<dialog id="dlg"><form id="dlgForm" method="dialog"><h3 id="dlgTitle" style="margin-bottom:10px"></h3><div id="dlgBody"></div><div class="row"><button type="button" class="btn ghost" id="dlgCancel">Cancel</button><button class="btn" id="dlgOk">Save</button></div></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
/* ===== CONFIG: paste your values (anon key is public by design; never paste service_role) ===== */
const SUPABASE_URL = 'https://pzlbywxvluscwvcavskg.supabase.co';
const sb = configured ? supabase.createClient(new URL(SUPABASE_URL).origin, SUPABASE_ANON_KEY) : null;
  const FIXED = {Rent:9000,'Food and transport':30000,'Mobile bill':3000,'Loan repayment':20000};
const FIXED_TOTAL = 62000;
const CATS = {income:['Delivery earnings','Salary','Freelancing','Business income','Other income'],expense:['Food','Transport / fuel','Rent','Mobile','Loan','Shopping','Maintenance','Entertainment','Other']};

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, c='LKR') => (c==='USD'?'$':'LKR ') + Number(n).toLocaleString('en-LK',{minimumFractionDigits:c==='USD'?2:0,maximumFractionDigits:2});
const toLKR = w => w.currency==='USD' ? w.balance*S.rate : Number(w.balance);
const day = d => new Date(d).toDateString();
function toast(msg, err){const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}

/* ===== state ===== */
const S = {wallets:[],tx:[],targets:[],rate:328.5,view:'home',period:'month',user:null};
const configured = !SUPABASE_URL.startsWith('YOUR_');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ===== theme ===== */
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('pp-theme',t)}catch(e){}}
setTheme((()=>{try{return localStorage.getItem('pp-theme')}catch(e){}})() || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

/* ===== auth ===== */
let mode = 'login';
function setMode(m){
  mode = m;
  $('#tab-login').classList.toggle('active', m==='login');
  $('#tab-signup').classList.toggle('active', m==='signup');
  $('#pw2wrap').classList.toggle('hidden', m!=='signup');
  $('#authBtn').textContent = m==='signup' ? 'Create account' : 'Log in';
  $('#pw').autocomplete = m==='signup' ? 'new-password' : 'current-password';
}
function initAuth(){
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('#authForm').addEventListener('submit', async e => {
    e.preventDefault();
    if(!sb) return toast('Supabase is not configured. See SETUP.md.', true);
    const email=$('#email').value.trim(), pw=$('#pw').value, btn=$('#authBtn');
    if(!/^\S+@\S+\.\S+$/.test(email)) return toast('Enter a valid email address.', true);
    if(pw.length<8) return toast('Password must be at least 8 characters.', true);
    if(mode==='signup' && pw!==$('#pw2').value) return toast('Passwords do not match.', true);
    btn.disabled=true; const label=btn.textContent; btn.textContent='Please wait…';
    try{
      if(mode==='signup'){
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin}});
        if(error) throw error;
        if(data.user && data.user.identities && data.user.identities.length===0) throw new Error('An account with this email already exists. Log in instead.');
        if(!data.session){toast('Check your email to confirm your account, then log in.');setMode('login')}
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pw});
        if(error) throw error;
      }
    }catch(err){toast(err.message||'Something went wrong.', true)}
    finally{btn.disabled=false; btn.textContent = mode==='signup'?'Create account':'Log in'}
  });
  $('#forgot').addEventListener('click', async e => {
    e.preventDefault(); if(!sb) return toast('Supabase is not configured.', true);
    const email=$('#email').value.trim(); if(!email) return toast('Enter your email first.', true);
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
    error ? toast(error.message,true) : toast('Password reset email sent.');
  });
}

/* ===== data ===== */
async function loadAll(){
  const [w,t,g,s]=await Promise.all([
    sb.from('wallets').select('*').order('created_at'),
    sb.from('transactions').select('*').order('occurred_at',{ascending:false}).limit(1000),
    sb.from('targets').select('*').order('created_at'),
    sb.from('user_settings').select('*').maybeSingle()]);
  const bad=[w,t,g,s].find(r=>r.error); if(bad) return toast('Could not load data: '+bad.error.message,true);
  S.wallets=w.data.map(x=>({...x,balance:Number(x.balance)})); S.tx=t.data.map(x=>({...x,amount:Number(x.amount)}));
  S.targets=g.data.map(x=>({...x,goal_amount:Number(x.goal_amount),saved_amount:Number(x.saved_amount)}));
  if(s.data) S.rate=Number(s.data.usd_lkr_rate);
}
async function run(promise, okMsg){
  const {error}=await promise; if(error){toast(error.message,true);return false}
  await loadAll(); render(); if(okMsg) toast(okMsg); return true;
}

/* ===== generic form dialog ===== */
function form(title, fields, onSubmit, okLabel='Save'){
  $('#dlgTitle').textContent=title; $('#dlgOk').textContent=okLabel;
  $('#dlgBody').innerHTML=fields.map(f=>`<label for="f_${f.n}">${f.l}</label>`+(f.opts
    ?`<select id="f_${f.n}">${f.opts.map(o=>`<option value="${esc(o.v??o)}">${esc(o.t??o)}</option>`).join('')}</select>`
    :`<input id="f_${f.n}" type="${f.t||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(f.v??'')}" ${f.req?'required':''}>`)).join('');
  const dlg=$('#dlg'), ok=$('#dlgOk'); ok.disabled=false;
  $('#dlgCancel').onclick=()=>dlg.close();
  $('#dlgForm').onsubmit=async e=>{e.preventDefault();ok.disabled=true;
    const v={}; fields.forEach(f=>v[f.n]=$('#f_'+f.n).value);
    const done=await onSubmit(v); ok.disabled=false; if(done) dlg.close()};
  dlg.showModal();
}
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};

function addWallet(){form('New wallet',[{n:'name',l:'Name',req:1},{n:'cur',l:'Currency',opts:['LKR','USD']},{n:'bal',l:'Opening balance',t:'number',step:'0.01',v:0}],async v=>{
  const bal=Number(v.bal); if(!v.name.trim()||isNaN(bal)||bal<0){toast('Enter a name and a valid balance.',true);return false}
  return run(sb.from('wallets').insert({name:v.name.trim(),currency:v.cur,balance:bal}),'Wallet created')})}
function delWallet(id){const w=S.wallets.find(x=>x.id===id);
  form('Delete wallet?',[],()=>run(sb.from('wallets').delete().eq('id',id),'Wallet deleted'),'Delete');
  $('#dlgBody').innerHTML=`<p style="margin-bottom:14px">"${esc(w.name)}" and its transactions will be permanently deleted.</p>`}
function addTx(type, wid){
  if(!S.wallets.length) return toast('Create a wallet first.',true);
  const cats=()=>CATS[type];
  form(type==='income'?'Add income':'Add expense',[
    {n:'w',l:'Wallet',opts:S.wallets.map(w=>({v:w.id,t:`${w.name} (${w.currency})`}))},
    {n:'amt',l:'Amount',t:'number',step:'0.01',req:1},{n:'cat',l:'Category',opts:cats()},
    {n:'note',l:'Note (optional)'},{n:'at',l:'Date and time',t:'datetime-local',v:nowLocal()}],async v=>{
    const amt=Number(v.amt); if(!(amt>0)){toast('Enter an amount above 0.',true);return false}
    return run(sb.rpc('add_transaction',{p_wallet:v.w,p_type:type,p_amount:amt,p_category:v.cat,p_note:v.note||null,p_occurred:new Date(v.at).toISOString()}),type==='income'?'Income saved':'Expense saved')});
  if(wid) $('#f_w').value=wid;
}
function targetForm(t){form(t?'Edit target':'New target',[{n:'name',l:'Target name',v:t?.name,req:1},{n:'goal',l:'Goal amount (LKR)',t:'number',v:t?.goal_amount},{n:'dl',l:'Deadline',t:'date',v:t?.deadline||''}],async v=>{
  const goal=Number(v.goal); if(!v.name.trim()||!(goal>0)){toast('Enter a name and a goal above 0.',true);return false}
  const row={name:v.name.trim(),goal_amount:goal,deadline:v.dl||null};
  return run(t?sb.from('targets').update(row).eq('id',t.id):sb.from('targets').insert(row),'Target saved')})}
function contribute(id){form('Add savings',[{n:'amt',l:'Amount (LKR)',t:'number',req:1}],async v=>{
  const a=Number(v.amt); if(!(a>0)){toast('Enter an amount above 0.',true);return false}
  return run(sb.rpc('contribute_target',{p_target:id,p_amount:a}),'Savings added')})}
function delTarget(id){form('Delete target?',[],()=>run(sb.from('targets').delete().eq('id',id),'Target deleted'),'Delete');$('#dlgBody').innerHTML='<p style="margin-bottom:14px">This cannot be undone.</p>'}

/* ===== views ===== */
const txRow=t=>{const w=S.wallets.find(x=>x.id===t.wallet_id);return `<div class="row" style="padding:8px 0;border-top:1px solid var(--bd)"><div><b>${esc(t.category)}</b><div class="mute">${new Date(t.occurred_at).toLocaleString('en-LK',{dateStyle:'medium',timeStyle:'short'})}${w?' · '+esc(w.name):''}${t.note?' · '+esc(t.note):''}</div></div><b class="${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'−'}${money(t.amount,w?.currency)}</b></div>`};
const empty=(m)=>`<p class="mute" style="padding:8px 0">${m}</p>`;
const targetCalc=t=>{const rem=Math.max(0,t.goal_amount-t.saved_amount),pct=Math.min(100,t.saved_amount/t.goal_amount*100);
  const days=t.deadline?Math.ceil((new Date(t.deadline)-new Date().setHours(0,0,0,0))/864e5):null;
  return {rem,pct,days,perDay:days>0?rem/days:null}};

const views={
home(){
  const net=S.wallets.reduce((a,w)=>a+toLKR(w),0), today=S.tx.filter(t=>day(t.occurred_at)===day(new Date()));
  const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+toLKR({balance:t.amount,currency:S.wallets.find(w=>w.id===t.wallet_id)?.currency}),0);
  const inc=sum(today,'income'),exp=sum(today,'expense');
  return `<div class="row" style="margin-bottom:14px"><div class="brand"><span>Pocket</span><b>Pulse</b></div><button class="btn ghost" id="themeBtn">Theme</button></div>
  <div class="card hero"><div class="mute">Net worth · ${new Date().toLocaleDateString('en-LK',{dateStyle:'full'})}</div><div class="num">${money(net)}</div><div class="mute">${S.wallets.length} wallet${S.wallets.length===1?'':'s'} · 1 USD = ${S.rate} LKR (planning rate)</div></div>
  <div class="grid"><div class="card"><div class="mute">Income today</div><b class="num pos" style="font-size:20px">${money(inc)}</b></div><div class="card"><div class="mute">Spent today</div><b class="num neg" style="font-size:20px">${money(exp)}</b></div><div class="card"><div class="mute">Net today</div><b class="num" style="font-size:20px">${money(inc-exp)}</b></div></div>
  <div class="row" style="gap:8px;margin-bottom:12px"><button class="btn" style="flex:1" data-act="inc">+ Income</button><button class="btn ghost" style="flex:1" data-act="exp">− Expense</button></div>
  <div class="card"><h3>Monthly fixed baseline <span class="mute">(planning, not deducted)</span></h3>${Object.entries(FIXED).map(([k,v])=>`<div class="row"><span>${k}</span><span>${money(v)}</span></div>`).join('')}<div class="row" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:6px"><b>Total</b><b>${money(FIXED_TOTAL)}</b></div></div>
  <div class="card"><h3>Recent activity</h3>${S.tx.slice(0,6).map(txRow).join('')||empty('No transactions yet. Add your first income or expense.')}</div>
  <div class="card"><h3>Savings progress</h3>${S.targets.map(t=>{const c=targetCalc(t);return `<div style="margin-top:8px"><div class="row"><span>${esc(t.name)}</span><span class="mute">${c.pct.toFixed(0)}%</span></div><div class="bar"><i style="width:${c.pct}%"></i></div></div>`}).join('')||empty('No targets yet.')}</div>
  <button class="btn ghost" id="exportBtn">Export my data</button> <button class="btn ghost" id="outBtn">Log out</button>
  <div class="card" style="margin-top:12px"><label for="rate">USD/LKR planning rate</label><input id="rate" type="number" step="0.01" value="${S.rate}"><button class="btn" id="rateBtn">Save rate</button></div>`},
targets(){return `<div class="row" style="margin-bottom:12px"><h2>Targets</h2><button class="btn" data-act="newT">+ New</button></div>`+
  (S.targets.map(t=>{const c=targetCalc(t);return `<div class="card"><div class="row"><h3>${esc(t.name)}</h3><span class="mute">${c.pct.toFixed(0)}%</span></div><div class="bar"><i style="width:${c.pct}%"></i></div>
  <div class="row mute"><span>${money(t.saved_amount)} of ${money(t.goal_amount)}</span><span>${money(c.rem)} left</span></div>
  <div class="mute">${c.days===null?'No deadline':c.days>0?`${c.days} days left · save ${money(Math.ceil(c.perDay))}/day`:c.rem>0?'Deadline passed':''}${c.rem===0?'Goal reached 🎉':''}</div>
  <div class="row" style="margin-top:10px;gap:6px"><button class="btn" data-act="contrib" data-id="${t.id}">Add savings</button><button class="btn ghost" data-act="editT" data-id="${t.id}">Edit</button><button class="btn ghost danger" data-act="delT" data-id="${t.id}">Delete</button></div></div>`}).join('')||empty('No targets yet. Set a goal like a new camera and a deadline.'))},
wallets(){return `<div class="row" style="margin-bottom:12px"><h2>Wallets</h2><button class="btn" data-act="newW">+ New</button></div>`+
  (S.wallets.map(w=>`<div class="card"><div class="row"><h3>${esc(w.name)}</h3><span class="mute">${w.currency}</span></div><div class="num ${w.balance<0?'neg':''}">${money(w.balance,w.currency)}</div>${w.currency==='USD'?`<div class="mute">≈ ${money(toLKR(w))}</div>`:''}
  <div class="row" style="gap:6px;margin:10px 0"><button class="btn" data-act="inc" data-id="${w.id}">+ Income</button><button class="btn ghost" data-act="exp" data-id="${w.id}">− Expense</button><button class="btn ghost danger" data-act="delW" data-id="${w.id}">Delete</button></div>
  ${S.tx.filter(t=>t.wallet_id===w.id).slice(0,5).map(txRow).join('')||empty('No transactions yet.')}</div>`).join('')||empty('No wallets yet. Create one, like Daily Cash or Delivery Earnings.'))},
reports(){return `<h2 style="margin-bottom:12px">Reports</h2><div class="tabs">${['day','week','month','year'].map(p=>`<button data-p="${p}" class="${S.period===p?'active':''}">${{day:'Daily',week:'Weekly',month:'Monthly',year:'Annual'}[p]}</button>`).join('')}</div>
  <div id="repSum" class="grid"></div>
  <div class="card"><h3>Income vs expenses</h3><canvas id="c1"></canvas></div><div class="card"><h3>Spending by category</h3><canvas id="c2"></canvas></div>
  <div class="card"><h3>Savings progress</h3><canvas id="c3"></canvas></div>
  <p class="mute">Totals are actual recorded transactions. The fixed baseline (${money(FIXED_TOTAL)}/month) is a planning estimate.</p>`},
ai(){return `<h2>PocketPulse Gemini AI Advisor</h2><p class="mute" style="margin-bottom:12px">Ask about your own wallets, spending and goals. General guidance only, not professional financial advice.</p>
  <div class="card"><input id="q" maxlength="500" placeholder="Can I afford to save LKR 1,000 today?"><button class="btn" id="askBtn">Ask</button><div id="ans"></div></div>`}
};

function chartColors(){const d=document.documentElement.dataset.theme==='dark';Chart.defaults.color=d?'#9AA99E':'#78847D';Chart.defaults.borderColor=d?'#2A3930':'#E5EBE5'}
let charts=[];
function drawReports(){
  charts.forEach(c=>c.destroy());charts=[];chartColors();
  const start=new Date();start.setHours(0,0,0,0);
  if(S.period==='week')start.setDate(start.getDate()-6);else if(S.period==='month')start.setDate(1);else if(S.period==='year')start.setMonth(0,1);
  const L=t=>toLKR({balance:t.amount,currency:S.wallets.find(w=>w.id===t.wallet_id)?.currency});
  const list=S.tx.filter(t=>new Date(t.occurred_at)>=start);
  const inc=list.filter(t=>t.type==='income').reduce((s,t)=>s+L(t),0),exp=list.filter(t=>t.type==='expense').reduce((s,t)=>s+L(t),0);
  $('#repSum').innerHTML=`<div class="card"><div class="mute">Income</div><b class="pos">${money(inc)}</b></div><div class="card"><div class="mute">Expenses</div><b class="neg">${money(exp)}</b></div><div class="card"><div class="mute">Net</div><b>${money(inc-exp)}</b></div>`;
  charts.push(new Chart($('#c1'),{type:'bar',data:{labels:['Income','Fixed baseline (plan)','Expenses'],datasets:[{data:[inc,S.period==='year'?FIXED_TOTAL*12:S.period==='month'?FIXED_TOTAL:null,exp],backgroundColor:['#9BD65A','#D8A84E','#DD7569']}]},options:{plugins:{legend:{display:false}}}}));
  const cat={};list.filter(t=>t.type==='expense').forEach(t=>cat[t.category]=(cat[t.category]||0)+L(t));
  charts.push(new Chart($('#c2'),{type:'doughnut',data:{labels:Object.keys(cat),datasets:[{data:Object.values(cat),backgroundColor:['#DD7569','#D8A84E','#9BD65A','#183B2C','#7FB069','#E9B872','#B85C52','#5B9E37','#94A89B']}]}}));
  charts.push(new Chart($('#c3'),{type:'bar',data:{labels:S.targets.map(t=>t.name),datasets:[{label:'Saved',data:S.targets.map(t=>t.saved_amount),backgroundColor:'#9BD65A'},{label:'Goal',data:S.targets.map(t=>t.goal_amount),backgroundColor:'#D8A84E'}]},options:{indexAxis:'y'}}));
}
function localAdvice(q){
  const m=S.tx.filter(t=>new Date(t.occurred_at)>=new Date(new Date().setDate(1)));
  const net=S.wallets.reduce((a,w)=>a+toLKR(w),0),exp=m.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return `The AI service is unavailable, so here is a quick summary from your data:\n• Net worth: ${money(net)}\n• Spent this month: ${money(exp)}\n• Fixed baseline: ${money(FIXED_TOTAL)}/month\nTry again later for a personalised answer.`}

function render(){
  const v=$('#view');v.innerHTML=views[S.view]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  if(S.view==='reports')drawReports();
}
function bindApp(){
  document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.v;render()}));
  const v=$('#view'); // single delegated listener: no duplicates after re-render
  v.addEventListener('click',async e=>{
    const el=e.target.closest('[data-act],[data-p],#themeBtn,#outBtn,#exportBtn,#rateBtn,#askBtn');if(!el)return;
    const id=el.dataset.id,a=el.dataset.act;
    if(el.dataset.p){S.period=el.dataset.p;return render()}
    if(el.id==='themeBtn'){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');return render()}
    if(el.id==='outBtn'){await sb.auth.signOut();return}
    if(el.id==='exportBtn'){const b=new Blob([JSON.stringify({wallets:S.wallets,transactions:S.tx,targets:S.targets},null,2)],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='pocketpulse-export.json';u.click();return}
    if(el.id==='rateBtn'){const r=Number($('#rate').value);if(!(r>0))return toast('Enter a valid rate.',true);return run(sb.from('user_settings').upsert({user_id:S.user.id,usd_lkr_rate:r}),'Rate saved')}
    if(el.id==='askBtn'){const q=$('#q').value.trim();if(!q)return;el.disabled=true;$('#ans').innerHTML='<div class="chat">Thinking…</div>';
      let txt;try{const {data,error}=await sb.functions.invoke('financial-advisor',{body:{question:q}});if(error||!data?.answer)throw error||new Error(data?.error);txt=data.answer}catch(err){txt=localAdvice(q)}
      $('#ans').innerHTML=`<div class="chat">${esc(txt)}</div>`;el.disabled=false;return}
    ({inc:()=>addTx('income',id),exp:()=>addTx('expense',id),newW:addWallet,delW:()=>delWallet(id),newT:()=>targetForm(),editT:()=>targetForm(S.targets.find(t=>t.id===id)),contrib:()=>contribute(id),delT:()=>delTarget(id)})[a]?.();
  });
}

/* ===== boot ===== */
let appBound=false;
async function onSession(session){
  const signedIn=!!session;
  $('#auth').classList.toggle('hidden',signedIn);$('#app').classList.toggle('hidden',!signedIn);$('#nav').classList.toggle('hidden',!signedIn);
  if(!signedIn){S.user=null;return}
  S.user=session.user;if(!appBound){bindApp();appBound=true}
  await loadAll();render();
}
document.addEventListener('DOMContentLoaded',async()=>{
  initAuth();
  if(!sb){$('#auth').classList.remove('hidden');$('#cfgWarn').classList.remove('hidden');return}
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='TOKEN_REFRESHED')setTimeout(()=>onSession(session),0)});
});
</script>
</body>
